<svg xmlns="http://www.w3.org/2000/svg" width="140" height="130" viewBox="0 0 140 130">
  <!-- Pawlowska: koronka z piór na glowie i opierzone nogi jak buciki. -->
  <defs>
    <radialGradient id="pvBody" cx="54" cy="58" r="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF8EC"/>
      <stop offset="0.6" stop-color="#EFE2CC"/>
      <stop offset="1" stop-color="#C9B998"/>
    </radialGradient>
    <radialGradient id="pvHead" cx="96" cy="44" r="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFBF2"/>
      <stop offset="1" stop-color="#E4D5BB"/>
    </radialGradient>
    <linearGradient id="pvCrown" x1="78" y1="8" x2="116" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#D8C7A6"/>
    </linearGradient>
  </defs>

  <g stroke="#8A6A55" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="64" cy="122" rx="42" ry="8" fill="#6B8F4E" fill-opacity="0.28" stroke="none"/>

    <!-- ogon rozlozony szeroko -->
    <path d="M28 66Q6 48 14 24Q34 36 42 58Z" fill="#6E6052"/>
    <path d="M22 74Q2 62 6 44Q24 52 34 66Z" fill="#8E7F6C"/>

    <!-- opierzone nogi: pióra schodza az na palce, stad "buciki" -->
    <path d="M54 100q-13 3-13 14q14 3 19-5Z" fill="#F3E7D2"/>
    <path d="M84 100q13 3 13 14q-14 3-19-5Z" fill="#F3E7D2"/>
    <path d="M56 118h-8M56 118l-2 5" stroke="#C8A165" stroke-width="3.2"/>
    <path d="M86 118h8M86 118l2 5" stroke="#C8A165" stroke-width="3.2"/>

    <!-- tulow w ciemne cetki -->
    <ellipse cx="62" cy="68" rx="42" ry="34" fill="url(#pvBody)"/>
    <g fill="#8A7A66" stroke="none">
      <ellipse cx="44" cy="58" rx="4" ry="5"/>
      <ellipse cx="60" cy="50" rx="4" ry="5"/>
      <ellipse cx="74" cy="60" rx="4" ry="5"/>
      <ellipse cx="52" cy="78" rx="4" ry="5"/>
      <ellipse cx="70" cy="84" rx="4" ry="5"/>
      <ellipse cx="86" cy="72" rx="4" ry="5"/>
      <ellipse cx="34" cy="74" rx="3.4" ry="4.4"/>
    </g>
    <path d="M42 62Q62 54 78 68" fill="none" stroke-width="3"/>

    <!-- glowa -->
    <circle cx="98" cy="46" r="21" fill="url(#pvHead)"/>

    <!-- korona z piór — znak rozpoznawczy rasy -->
    <path d="M80 30q-6-18 6-22q4 8 2 16Z" fill="url(#pvCrown)"/>
    <path d="M92 24q-2-20 8-20q4 10 0 20Z" fill="url(#pvCrown)"/>
    <path d="M106 26q6-18 15-13q-2 11-9 17Z" fill="url(#pvCrown)"/>
    <path d="M114 38q13-9 18 0q-9 7-18 5Z" fill="url(#pvCrown)"/>

    <!-- broda pod dziobem, tez typowa dla rasy -->
    <path d="M104 60q10 4 8 12q-10 1-14-6Z" fill="#F3E7D2"/>
    <!-- dziob -->
    <path d="M118 44l15 5-15 5Z" fill="#D8B778"/>

    <!-- oko -->
    <circle cx="108" cy="42" r="4.4" fill="#5C4030" stroke="none"/>
    <circle cx="109.5" cy="40.5" r="1.6" fill="#FFFFFF" stroke="none"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="140" height="130" viewBox="0 0 140 130">
  <defs>
    <radialGradient id="brBody" cx="54" cy="52" r="66" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="0.62" stop-color="#F6ECD6"/>
      <stop offset="1" stop-color="#DFCDAE"/>
    </radialGradient>
    <radialGradient id="brHead" cx="92" cy="28" r="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="1" stop-color="#EADCC2"/>
    </radialGradient>
    <linearGradient id="brHackle" x1="76" y1="18" x2="104" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6E6256"/>
      <stop offset="1" stop-color="#4A4138"/>
    </linearGradient>
    <linearGradient id="brTail" x1="6" y1="26" x2="40" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6B5F53"/>
      <stop offset="1" stop-color="#453C33"/>
    </linearGradient>
    <linearGradient id="brBeak" x1="116" y1="36" x2="136" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD98A"/>
      <stop offset="1" stop-color="#EDA845"/>
    </linearGradient>
  </defs>

  <g stroke="#8A6A55" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="66" cy="122" rx="44" ry="8" fill="#6B8F4E" fill-opacity="0.28" stroke="none"/>

    <!-- ogon: krotki, szeroko rozlozony -->
    <path d="M26 66Q4 46 12 24Q32 36 40 56Z" fill="url(#brTail)"/>
    <path d="M20 74Q0 64 4 44Q22 52 32 66Z" fill="#7A6D5F"/>

    <!-- upierzone skoki, znak rozpoznawczy brahmy -->
    <path d="M54 104q-12 2-13 12q13 3 18-4Z" fill="#F6ECD6"/>
    <path d="M86 104q12 2 13 12q-13 3-18-4Z" fill="#F6ECD6"/>
    <path d="M56 116h-8M56 116l-2 6" stroke="#EDA845" stroke-width="3.4"/>
    <path d="M88 116h8M88 116l2 6" stroke="#EDA845" stroke-width="3.4"/>

    <!-- tulow: masywny, brahma to olbrzym -->
    <ellipse cx="64" cy="68" rx="47" ry="40" fill="url(#brBody)"/>

    <!-- skrzydlo wtulone w pierze -->
    <path d="M42 60Q68 48 86 70Q66 90 44 82Q34 71 42 60Z" fill="#EFE1C6"/>
    <path d="M50 68Q64 63 76 72" fill="none" stroke-width="3"/>

    <!-- glowa i ciemna kryza na szyi -->
    <path d="M80 26Q104 20 104 52Q88 60 78 48Z" fill="url(#brHackle)"/>
    <circle cx="99" cy="38" r="24" fill="url(#brHead)"/>

    <!-- grzebien groszkowy: niski, trojrzedowy -->
    <path d="M88 18q5-8 10-1q5-8 10 0q4-6 7 1" fill="#E9867E"/>
    <!-- korale -->
    <path d="M107 56q7 2 7 9q-7 2-11-4Z" fill="#E4706A"/>
    <!-- dziob -->
    <path d="M120 40l16 5-16 6Z" fill="url(#brBeak)"/>

    <!-- oko -->
    <circle cx="109" cy="34" r="4.5" fill="#5C4030" stroke="none"/>
    <circle cx="110.6" cy="32.4" r="1.6" fill="#FFFFFF" stroke="none"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="140" height="130" viewBox="0 0 140 130">
  <!-- Kura szabo: pióra podwinięte na zewnątrz, jakby ją ktoś czesał pod włos. -->
  <defs>
    <radialGradient id="frBody" cx="56" cy="58" r="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF2DC"/>
      <stop offset="0.6" stop-color="#F3DCB8"/>
      <stop offset="1" stop-color="#D9BC90"/>
    </radialGradient>
    <radialGradient id="frHead" cx="96" cy="34" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF6E8"/>
      <stop offset="1" stop-color="#E8CFA6"/>
    </radialGradient>
    <linearGradient id="frBeak" x1="116" y1="40" x2="136" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD98A"/>
      <stop offset="1" stop-color="#EDA845"/>
    </linearGradient>
  </defs>

  <g stroke="#8A6A55" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="64" cy="122" rx="42" ry="8" fill="#6B8F4E" fill-opacity="0.28" stroke="none"/>

    <!-- ogon z odstajacych, podwinietych piór -->
    <path d="M28 70q-16-6-14-22q12 2 16 12q4-12 16-10q-2 12-10 18Z" fill="#E6CDA4"/>

    <!-- nogi -->
    <path d="M56 98v16M56 114h-9M56 114l-3 7" stroke="#EDA845" stroke-width="3.6"/>
    <path d="M80 98v16M80 114h9M80 114l3 7" stroke="#EDA845" stroke-width="3.6"/>

    <!-- tulow -->
    <ellipse cx="64" cy="68" rx="40" ry="34" fill="url(#frBody)"/>

    <!-- loki: kazde pioro odgiete na zewnatrz, to znak rozpoznawczy rasy -->
    <g fill="#FBEAD0">
      <path d="M26 54q-12-4-10-14q10 1 14 9Z"/>
      <path d="M30 76q-14 2-16 12q11 3 17-4Z"/>
      <path d="M42 96q-9 9-3 17q9-5 9-14Z"/>
      <path d="M70 102q-2 12 7 15q4-9-1-17Z"/>
      <path d="M96 88q7 9 17 5q-4-9-13-10Z"/>
      <path d="M100 62q12 1 15-8q-10-4-17 2Z"/>
      <path d="M44 38q-6-11-17-9q2 10 11 13Z"/>
      <path d="M70 32q1-12-9-15q-3 10 2 17Z"/>
    </g>
    <path d="M46 62q16-8 30 2" fill="none" stroke-width="3"/>

    <!-- glowa, tez w lokach -->
    <circle cx="98" cy="42" r="23" fill="url(#frHead)"/>
    <path d="M88 20q-3-11 6-14q4 9 0 15Z" fill="#FBEAD0"/>
    <path d="M114 24q9-7 16 0q-7 7-16 4Z" fill="#FBEAD0"/>
    <!-- grzebien -->
    <path d="M86 24q4-10 10-2q5-9 11-1q4-7 7 1" fill="#E9867E"/>
    <!-- korale -->
    <path d="M106 60q7 2 7 9q-7 2-11-4Z" fill="#E4706A"/>
    <!-- dziob -->
    <path d="M119 44l16 5-16 6Z" fill="url(#frBeak)"/>
    <!-- oko -->
    <circle cx="108" cy="38" r="4.5" fill="#5C4030" stroke="none"/>
    <circle cx="109.6" cy="36.4" r="1.6" fill="#FFFFFF" stroke="none"/>
  </g>
</svg>
